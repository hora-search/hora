[package]
authors = ["aljun <gagasalamer@outlook.com>", "moonlight"]
edition = "2021"
license = "Apache-2.0"
name = "hora"
version = "0.1.1"

description = "Hora Search Everywhere"
homepage = "https://horasearch.com"
readme = "README.md"
repository = "https://github.com/hora-search/hora"

categories = ["algorithms", "data-structures"]
keywords = ["intelligence", "neighbor", "SIMD", "search", "distance"]

[package.metadata.docs.rs]
all-features = true

[profile.dev]
codegen-units = 4
debug = 1
debug-assertions = true
incremental = true
lto = false
opt-level = 0
overflow-checks = false
panic = 'unwind'
rpath = false

[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = "fat"
opt-level = 3
overflow-checks = false
panic = 'unwind'
rpath = false

[features]
no_std = ["hashbrown"]
no_thread = []
simd = []

[dependencies]
bincode = "1.3"
fixedbitset = "0.5"
hashbrown = {version = "0.15", optional = true}
log = "0.4"
num = "0.4"
rand = "0.8"
rayon = "1.11"
serde = {version = "1.0", features = ["derive"]}

[dev-dependencies]
criterion = "0.5"
rand_distr = "0.4"
hdf5 = "0.8.1"

[[bench]]
harness = false
name = "bench_metrics"
